# Alembic yapılandırması.
# Veritabanı adresi burada TUTULMAZ; alembic/env.py onu get_settings() üzerinden okur.
# Böylece tek doğruluk kaynağı .env dosyası olur (§5).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Sürüm dosyası adı: 0001_aciklama.py biçiminde artan sırada
file_template = %%(rev)s_%%(slug)s

# Not: post_write_hooks bilinçli olarak tanımlanmadı. Otomatik ruff format kancası,
# ruff kurulu olmayan bir makinede migration üretimini tamamen bloke ediyor.
# Formatlama `make lint` ile yapılır.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
